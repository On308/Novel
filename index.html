<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Archive Viewer</title>

    <!-- 테마 FOUC 방지 -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('novel_archive_theme') === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
	
    <!-- 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">

    <link rel="stylesheet" href="style.css">
    <style>
        /* 8) 소설 및 설정 본문 드래그 및 마우스 우클릭 방지 */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        input, textarea, .search-inline input {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <header class="app-header">
	    <div class="brand">
            <button class="brand-icon" onclick="viewer.goToList()">N</button>
            <div id="globalStats" class="global-stats" title="모든 작품의 누적 통계">
                <span class="stat-item"><span class="stat-label">누적 글자</span> <strong id="statChars">0</strong></span>
                <span class="stat-sep">·</span>
                <span class="stat-item"><span class="stat-label">누적 회차</span> <strong id="statChapters">0</strong></span>
            </div>
        </div>
				
        <div class="header-actions">
            <button onclick="viewer.toggleDarkMode()" id="themeToggleBtn" class="btn-icon" title="테마 전환"></button>
            <button onclick="viewer.reloadJSON()" class="btn btn-soft" title="최신 data.json 새로고침">🔄 데이터 새로고침</button>
        </div>
    </header>

    <main class="app-main">
        <div id="toastContainer" class="toast-container"></div>
        <div id="appView" class="app-view">
            <div class="view-loading">작품 데이터를 불러오는 중입니다...</div>
        </div>
    </main>

    <div class="scroll-buttons">
        <div class="scroll-btn-grid">
            <button onclick="window.scrollTo({top:0})" class="scroll-btn" title="빠르게 맨 위로">▲</button>
            <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="scroll-btn" title="부드럽게 맨 위로">↑</button>
            <button onclick="window.scrollTo({top:document.body.scrollHeight})" class="scroll-btn" title="빠르게 맨 아래로">▼</button>
            <button onclick="window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'})" class="scroll-btn" title="부드럽게 맨 아래로">↓</button>
        </div>
        <div id="liveClock" class="live-clock">
            <div class="live-clock-date">-</div>
            <div class="live-clock-ampm">-</div>
            <div class="live-clock-time">--:--:--</div>
        </div>
    </div>

    <!-- 뷰어 전용 통합 엔진 스크립트 -->
    <script src="js/constants.js"></script>
    <script src="js/utils.js"></script>
    <script>
        /* ============================================================
           MARKDOWN & HELPER FUNCTIONS (원본 소스 기반 마크다운 렌더러)
           ============================================================ */
        function wrapListItems(html, markerClass, tag) {
            if (markerClass) {
                return html.replace(
                    new RegExp(`(?:<li class="${markerClass}">[\\s\\S]*?<\\/li>\\s*)+`, 'g'),
                    (block) => {
                        const cleaned = block
                            .replace(new RegExp(`<li class="${markerClass}">`, 'g'), '<li>')
                            .replace(/<\/li>\s+<li/g, '</li><li');
                        return `<${tag}>${cleaned}</${tag}>`;
                    }
                );
            }
            return html.replace(
                /(?:<li(?! class="md-ol-item")[^>]*>[\s\S]*?<\/li>\s*)+/g,
                (block) => {
                    const cleaned = block.replace(/<\/li>\s+<li/g, '</li><li');
                    return `<ul>${cleaned}</ul>`;
                }
            );
        }

        function wrapParagraphs(html) {
            const BLOCK_START = /^\s*<(?:ul|ol|table|blockquote|hr|h[1-4]|li|p)\b/i;
            const STANDALONE_IMG = /^\s*\[\[STANDALONE_IMG\]\]/;
            const lines = html.split('\n');
            const out = [];
            let buffer = [];

            const flush = () => {
                if (buffer.length === 0) return;
                const content = buffer.join('<br>').trim();
                if (content) out.push(`<p class="md-p">${content}</p>`);
                buffer = [];
            };

            for (const line of lines) {
                if (line.trim() === '') { flush(); continue; }
                if (STANDALONE_IMG.test(line)) {
                    flush();
                    const cleaned = line.replace(/\[\[STANDALONE_IMG\]\]/g, '').replace(/\[\[\/STANDALONE_IMG\]\]/g, '');
                    out.push(cleaned);
                    continue;
                }
                if (BLOCK_START.test(line)) { flush(); out.push(line); continue; }
                buffer.push(line);
            }
            flush();
            return out.join('\n');
        }

        function parseMarkdownTables(html) {
            const lines = html.split('\n');
            const result = [];
            let i = 0;

            const isPipeLine = (s) => /^\s*\|.*\|\s*$/.test(s);
            const isSepLine  = (s) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(s);
            const splitCells = (line) => line.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
            const parseAlign = (sep) => sep.replace(/\s/g, '').replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => {
                const left = cell.startsWith(':'), right = cell.endsWith(':');
                if (left && right) return 'center';
                if (right) return 'right';
                if (left) return 'left';
                return '';
            });

            while (i < lines.length) {
                const head = lines[i], sep = lines[i + 1];
                if (isPipeLine(head) && sep !== undefined && isSepLine(sep)) {
                    const headers = splitCells(head), aligns = parseAlign(sep), rows = [];
                    let j = i + 2;
                    while (j < lines.length && isPipeLine(lines[j])) {
                        rows.push(splitCells(lines[j]));
                        j++;
                    }
                    const thead = `<thead><tr>${headers.map((h, k) => `<th${aligns[k] ? ` style="text-align:${aligns[k]};"` : ''}>${h}</th>`).join('')}</tr></thead>`;
                    const tbody = `<tbody>${rows.map(cells => `<tr>${headers.map((_, k) => `<td${aligns[k] ? ` style="text-align:${aligns[k]};"` : ''}>${cells[k] !== undefined ? cells[k] : ''}</td>`).join('')}</tr>`).join('')}</tbody>`;
                    result.push(`<table class="md-table">${thead}${tbody}</table>`);
                    i = j;
                } else {
                    result.push(head);
                    i++;
                }
            }
            return result.join('\n');
        }

        function parseMarkdown(text) {
            if (!text) return '';
            let out = escapeHtml(text);
            out = parseMarkdownTables(out);
            out = out.replace(/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/gm, '<hr class="md-hr">');
            out = out.replace(/(?:^&gt;[^\n]*(?:\n|$))+/gm, (block) => {
                const inner = block.replace(/\n$/, '').split('\n').map(line => line.replace(/^&gt;\s?/, '')).join('<br>');
                return `<blockquote class="md-quote">${inner}</blockquote>\n`;
            });
            out = out.replace(/^[-*]\s+\[\s\]\s+(.*)$/gm, '<li class="md-task"><input type="checkbox" disabled> $1</li>');
            out = out.replace(/^[-*]\s+\[[xX]\]\s+(.*)$/gm, '<li class="md-task"><input type="checkbox" checked disabled> $1</li>');
            out = out.replace(/^[-*]\s+(?!\[[ xX]\])(.*)$/gm, '<li>$1</li>');
            out = out.replace(/^####\s+(.*)$/gm, '<h5>$1</h5>');
            out = out.replace(/^###\s+(.*)$/gm,  '<h4>$1</h4>');
            out = out.replace(/^##\s+(.*)$/gm,   '<h3>$1</h3>');
            out = out.replace(/^#\s+(.*)$/gm,    '<h2>$1</h2>');
            out = out.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (match, alt, url) => {
                if (!/^(https?:\/\/|data:image\/|\/|\.\/|\.\.\/)/i.test(url)) return match;
                return `<img class="md-img" src="${url.replace(/"/g, '&quot;')}" alt="${alt.replace(/"/g, '&quot;')}" loading="lazy" referrerpolicy="no-referrer">`;
            });
            out = out.replace(/^(\s*)(<img[^>]*>)(\s*)$/gm, (match, sp1, img, sp2) => `${sp1}[[STANDALONE_IMG]]${img}[[/STANDALONE_IMG]]${sp2}`);
            out = out.replace(/~~(.*?)~~/g, '<del>$1</del>');
            out = out.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
            out = out.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            out = out.replace(/`([^`\n]+?)`/g, '<code class="md-code">$1</code>');
            out = wrapListItems(out, null, 'ul');
            out = wrapParagraphs(out);
            out = out.replace(/\[\[STANDALONE_IMG\]\]/g, '').replace(/\[\[\/STANDALONE_IMG\]\]/g, '');
            return out;
        }

        /* ============================================================
           NOVEL ARCHIVE VIEWER APP ENGINE
           ============================================================ */
        class NovelViewerApp {
            constructor() {
                this.novels = [];
                this.currentNovel = null;
                this.currentView = 'list';
                this.selectedNovelId = null;
                this.selectedChapterIndex = 0;
                this.selectedSettingIndex = 0;
                this.activeDetailTab = 'chapters';

                this.currentPage = 1;
                this.itemsPerPage = 16;
                this.searchQuery = '';
                this.selectedTag = '전체';
                this.selectedStatus = 'all';
                this.selectedAdult = 'all';
                this.sortOrder = 'latest'; // 1) 기본 정렬

                this.isDarkMode = false;
                this.fontSize = 13;
                this.fontFamily = 'font-nanumgothic';
                this.lineHeight = '180%';
                this.contentPadding = 16;
                this.tagCache = { counts: {}, allTags: [] };
                this._lastFilteredIds = null;

                this.initTheme();
                this.initEventDelegation();
                this.loadJSONData();
                this.initLiveClock();
            }

            async loadJSONData() {
                try {
                    const paths = ['./db/data.json', './data.json'];
                    let data = null;
                    for (const path of paths) {
                        try {
                            const res = await fetch(path + '?t=' + Date.now());
                            if (res.ok) { data = await res.json(); break; }
                        } catch (e) {}
                    }
                    if (!data) throw new Error('data.json 파일을 찾을 수 없습니다.');

                    this.novels = data.map(n => ({
                        ...n,
                        chapterCount: (n.chapters || []).length,
                        totalChars: (n.chapters || []).reduce((s, c) => s + ((c.content || '').length), 0),
                        hasRichSettings: typeof computeHasRichSettings === 'function' ? computeHasRichSettings(n.settings || []) : false
                    }));

                    this.rebuildTagCache();
                    this.render();
                    this.updateGlobalStats();
                    this.showToast('데이터를 성공적으로 불러왔습니다.');
                } catch (err) {
                    console.error(err);
                    const view = document.getElementById('appView');
                    if (view) {
                        view.innerHTML = `
                            <div style="text-align:center; padding:5rem; color:var(--text-faint);">
                                <h3>⚠️ 작품 데이터를 불러오지 못했습니다.</h3>
                                <p style="margin-top:0.5rem; font-size:0.85rem;">동일 폴더 또는 db 폴더에 <code>data.json</code> 파일이 존재하는지 확인해주세요.</p>
                                <button onclick="viewer.loadJSONData()" class="btn btn-soft" style="margin-top:1rem;">다시 시도</button>
                            </div>
                        `;
                    }
                }
            }

            reloadJSON() { this.loadJSONData(); }

            rebuildTagCache() {
                const counts = {};
                for (const n of this.novels) {
                    if (!n.keyword) continue;
                    n.keyword.split(',').forEach(t => {
                        const trimmed = t.trim();
                        if (trimmed) counts[trimmed] = (counts[trimmed] || 0) + 1;
                    });
                }
                const allTags = Object.keys(counts).sort((a, b) =>
                    counts[b] !== counts[a] ? counts[b] - counts[a] : a.localeCompare(b, 'ko')
                );
                this.tagCache = { counts, allTags };
            }

            getFilteredNovels() {
                const q = this.searchQuery;
                const sel = this.selectedTag;
                const statusFilter = this.selectedStatus || 'all';
                const adultFilter = this.selectedAdult || 'all';
                const filtered = this.novels.filter(n => {
                    if (q) {
                        const inTitle = (n.title || '').toLowerCase().includes(q);
                        const inKeyword = (n.keyword || '').toLowerCase().includes(q);
                        if (!inTitle && !inKeyword) return false;
                    }
                    if (sel !== '전체') {
                        const tags = (n.keyword || '').split(',').map(t => t.trim());
                        if (!tags.includes(sel)) return false;
                    }
                    if (statusFilter !== 'all' && (n.status || 'ongoing') !== statusFilter) return false;
                    if (adultFilter === 'adult'  && !n.isAdult) return false;
                    if (adultFilter === 'normal' &&  n.isAdult) return false;
                    return true;
                });
                
                // 1) 등록순 정렬 포함 (created_desc / created_asc)
                const comparators = {
                    latest:         (a, b) => new Date(b.updatedAt || b.createdAt || 0) - new Date(a.updatedAt || a.createdAt || 0),
                    created_desc:   (a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0),
                    created_asc:    (a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0),
                    title_asc:      (a, b) => (a.title || '').localeCompare(b.title || '', 'ko'),
                    chars_desc:     (a, b) => (b.totalChars || 0) - (a.totalChars || 0),
                };
                const cmp = comparators[this.sortOrder] || comparators['latest'];
                if (cmp) filtered.sort(cmp);
                return filtered;
            }

            updateGlobalStats() {
                const elChars = document.getElementById('statChars');
                const elChapters = document.getElementById('statChapters');
                if (!elChars || !elChapters) return;

                let totalChars = 0, totalChapters = 0;
                for (const n of this.novels) {
                    totalChars += n.totalChars || 0;
                    totalChapters += n.chapterCount || 0;
                }
                elChars.textContent = totalChars.toLocaleString();
                elChapters.textContent = totalChapters.toLocaleString();
            }

            render() {
                const view = document.getElementById('appView');
                if (!view) return;
                if (this.currentView === 'list') {
                    view.innerHTML = this.renderListView();
                    this._lastFilteredIds = this.getFilteredNovels().map(n => n.id);
                } else if (this.currentView === 'detail') {
                    view.innerHTML = this.renderDetailView();
                }
                this.updateGlobalStats();
            }

            goToList() {
                this.currentView = 'list';
                this.selectedNovelId = null;
                this.currentNovel = null;
                this.render();
                window.scrollTo({ top: 0, behavior: 'auto' });
            }

            goToDetail(novelId) {
                const novel = this.novels.find(n => n.id === novelId);
                if (!novel) { this.showToast('작품을 찾을 수 없습니다.', 'error'); return; }
                this.currentNovel = novel;
                this.currentView = 'detail';
                this.selectedNovelId = novelId;
                this.selectedChapterIndex = 0;
                this.selectedSettingIndex = 0;
                this.activeDetailTab = 'chapters';
                this.render();
                window.scrollTo({ top: 0, behavior: 'auto' });
            }

            /* 3) 본문 페이지 이전글 / 다음글 이동 */
            goToPrevNovel() {
                const list = this._lastFilteredIds || this.getFilteredNovels().map(n => n.id);
                const i = list.indexOf(this.selectedNovelId);
                if (i > 0) this.goToDetail(list[i - 1]);
                else this.showToast('이전 작품이 없습니다.', 'error');
            }
            goToNextNovel() {
                const list = this._lastFilteredIds || this.getFilteredNovels().map(n => n.id);
                const i = list.indexOf(this.selectedNovelId);
                if (i !== -1 && i < list.length - 1) this.goToDetail(list[i + 1]);
                else this.showToast('다음 작품이 없습니다.', 'error');
            }

            /* 4) 본문 화면 툴바 조작 메서드들 */
            changeFontFamily(val) { this.fontFamily = val; this.renderDetailViewDOM(); }
            changeLineHeight(val) { this.lineHeight = val; this.renderDetailViewDOM(); }
            changeFontSize(delta) {
                this.fontSize = Math.max(9, Math.min(30, this.fontSize + delta));
                const lbl = document.getElementById('fontSizeLabel');
                if (lbl) lbl.textContent = `${this.fontSize}pt`;
                this.renderDetailViewDOM();
            }
            changeContentPadding(delta) {
                this.contentPadding = Math.max(0, Math.min(60, this.contentPadding + delta));
                const lbl = document.getElementById('paddingSizeLabel');
                if (lbl) lbl.textContent = `${this.contentPadding}px`;
                this.renderDetailViewDOM();
            }

            handleInternalSearch(query) {
                if (this.activeDetailTab !== 'chapters') return;
                const displayEl = document.getElementById('chapterContentDisplay');
                if (!displayEl || !this.currentNovel) return;
                const raw = this.currentNovel.chapters[this.selectedChapterIndex].content || '';
                if (!query.trim()) { displayEl.innerText = raw.trim(); return; }
                const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`(${escaped})`, 'gi');
                const html = escapeHtml(raw).replace(regex, '<span class="search-highlight">$1</span>');
                displayEl.innerHTML = html;
                const hl = displayEl.querySelector('.search-highlight');
                if (hl) {
                    hl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    this.showToast(`'${query}' 검색 완료`);
                } else {
                    this.showToast('일치하는 단어가 없습니다.', 'error');
                }
            }

            renderDetailViewDOM() {
                const panel = document.getElementById('chapterContentPanel');
                if (panel && this.currentNovel) {
                    panel.innerHTML = this.renderChapterContentInner(this.currentNovel.chapters[this.selectedChapterIndex]);
                }
            }

            initTheme() {
                const saved = localStorage.getItem('novel_archive_theme');
                this.isDarkMode = saved === 'dark';
                document.documentElement.classList.toggle('dark', this.isDarkMode);
                this.updateThemeButtonIcon();
            }

            toggleDarkMode() {
                this.isDarkMode = !this.isDarkMode;
                document.documentElement.classList.toggle('dark', this.isDarkMode);
                localStorage.setItem('novel_archive_theme', this.isDarkMode ? 'dark' : 'light');
                this.updateThemeButtonIcon();
            }

            updateThemeButtonIcon() {
                const btn = document.getElementById('themeToggleBtn');
                if (btn) btn.innerHTML = this.isDarkMode ? '☀️' : '🌙';
            }

            initLiveClock() {
                const update = () => {
                    const clock = document.getElementById('liveClock');
                    if (!clock) return;
                    const now = new Date();
                    const y = now.getFullYear();
                    const m = String(now.getMonth() + 1).padStart(2, '0');
                    const d = String(now.getDate()).padStart(2, '0');
                    const days = ['일', '월', '화', '수', '목', '금', '토'];
                    const day = days[now.getDay()];
                    let hours = now.getHours();
                    const ampm = hours >= 12 ? '오후' : '오전';
                    hours = hours % 12 || 12;
                    const hh = String(hours).padStart(2, '0');
                    const mm = String(now.getMinutes()).padStart(2, '0');
                    const ss = String(now.getSeconds()).padStart(2, '0');
                    clock.querySelector('.live-clock-date').textContent = `${y}.${m}.${d} (${day})`;
                    clock.querySelector('.live-clock-ampm').textContent = ampm;
                    clock.querySelector('.live-clock-time').textContent = `${hh}:${mm}:${ss}`;
                };
                update();
                setInterval(update, 1000);
            }

            showToast(message, type = 'success') {
                const container = document.getElementById('toastContainer');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 200);
                }, 3000);
            }

            initEventDelegation() {
                document.addEventListener('click', (e) => {
                    const target = e.target.closest('[data-action]');
                    if (!target) return;
                    const action = target.dataset.action;
                    if (action === 'filter-tag') {
                        this.selectedTag = target.dataset.tag;
                        this.render();
                    } else if (action === 'filter-status') {
                        this.selectedStatus = target.dataset.status;
                        this.render();
                    } else if (action === 'filter-adult') {
                        this.selectedAdult = target.dataset.adult;
                        this.render();
                    }
                });
            }

            /* 2) 리스트 하단 검색창 및 상태/성인/태그 필터 패널 추가 */
            renderListView() {
                const { counts: tagCounts, allTags } = this.tagCache;
                const filtered = this.getFilteredNovels();
                return `
                    <div class="list-view">
                        <div class="panel list-controls">
                            <div class="list-controls-left">
                                <span class="total-count">총 작품수: <strong>${this.novels.length}</strong>개</span>
                            </div>
                            <div class="list-controls-right">
                                <select onchange="viewer.filterByTag(this.value)" class="select" style="width:auto;">
                                    <option value="전체" ${this.selectedTag === '전체' ? 'selected' : ''}>태그 보기</option>
                                    ${allTags.map(t => `<option value="${escapeHtml(t)}" ${this.selectedTag === t ? 'selected' : ''}>#${escapeHtml(t)} (${tagCounts[t]})</option>`).join('')}
                                </select>
                                <!-- 1) 등록순 정렬 포함 -->
                                <select onchange="viewer.changeSort(this.value)" class="select sort-select" style="width:auto;">
                                    <option value="latest" ${this.sortOrder === 'latest' ? 'selected' : ''}>업데이트순 (최신순)</option>
                                    <option value="created_desc" ${this.sortOrder === 'created_desc' ? 'selected' : ''}>등록순 (최신순)</option>
                                    <option value="created_asc" ${this.sortOrder === 'created_asc' ? 'selected' : ''}>등록순 (오래된순)</option>
                                    <option value="title_asc" ${this.sortOrder === 'title_asc' ? 'selected' : ''}>가나다순</option>
                                    <option value="chars_desc" ${this.sortOrder === 'chars_desc' ? 'selected' : ''}>글자수 많은순</option>
                                </select>
                            </div>
                        </div>

                        <div class="panel table-wrap">
                            <table class="novel-table">
                                <thead>
                                    <tr>
                                        <th style="width:4rem;">No</th>
                                        <th>제목</th>
                                        <th>키워드</th>
                                        <th style="width:5rem;">회차</th>
                                        <th style="width:7rem; text-align:right;">총 글자수</th>
                                        <th style="width:3.5rem; text-align:center;">상태</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${filtered.length === 0
                                        ? `<tr class="empty-row"><td colspan="6">조건에 일치하는 작품이 없습니다.</td></tr>`
                                        : filtered.map((novel, idx) => this.renderNovelRow(novel, idx + 1)).join('')
                                    }
                                </tbody>
                            </table>
                        </div>

                        <!-- 2) 리스트 하단 검색창 및 상태/성인/태그 필터 -->
                        <div class="panel search-panel">
                            <div class="search-row">
                                <div class="search-input-wrap">
                                    <input type="text" id="searchInput" class="input search-input"
                                           placeholder="🔍 제목 또는 태그 검색"
                                           value="${escapeHtml(this.searchQuery)}"
                                           onkeydown="if(event.key==='Enter') viewer.executeSearch()">
                                    <div class="search-actions">
                                        <button onclick="viewer.executeSearch()" class="btn btn-accent btn-sm">검색</button>
                                        <button onclick="viewer.resetSearch()" class="btn btn-soft btn-sm">초기화</button>
                                    </div>
                                </div>
                            </div>

                            <div class="tag-filter-row">
                                <span class="tag-filter-label">📌 상태:</span>
                                <button data-action="filter-status" data-status="all" class="tag-pill ${this.selectedStatus === 'all' ? 'active' : ''}">전체</button>
                                ${Object.values(NOVEL_STATUS).map(s => `
                                    <button data-action="filter-status" data-status="${s.id}" class="tag-pill ${this.selectedStatus === s.id ? 'active' : ''}">
                                        ${s.emoji} ${s.label}
                                    </button>`).join('')}
                            </div>

                            <div class="tag-filter-row">
                                <span class="tag-filter-label">🔞 성인:</span>
                                <button data-action="filter-adult" data-adult="all" class="tag-pill ${this.selectedAdult === 'all' ? 'active' : ''}">전체</button>
                                <button data-action="filter-adult" data-adult="adult" class="tag-pill ${this.selectedAdult === 'adult' ? 'active' : ''}">19금만</button>
                                <button data-action="filter-adult" data-adult="normal" class="tag-pill ${this.selectedAdult === 'normal' ? 'active' : ''}">일반만</button>
                            </div>

                            <div class="tag-filter-row">
                                <span class="tag-filter-label">🏷️ 태그:</span>
                                <button data-action="filter-tag" data-tag="전체" class="tag-pill ${this.selectedTag === '전체' ? 'active' : ''}">전체</button>
                                ${allTags.map(tag => `
                                    <button data-action="filter-tag" data-tag="${escapeHtml(tag)}" class="tag-pill ${this.selectedTag === tag ? 'active' : ''}">
                                        ${escapeHtml(tag)}
                                    </button>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            renderNovelRow(novel, index) {
                const tags = novel.keyword ? novel.keyword.split(',').map(t => t.trim()).filter(Boolean) : [];
                const statusInfo = getStatusInfo(novel.status || 'ongoing');
                return `
                    <tr>
                        <td class="cell-center id-cell">${index}</td>
                        <td class="cell-title">
                            <a href="javascript:void(0)" onclick="viewer.goToDetail(${novel.id})" class="title-link">
                                <span class="color-dot" style="background-color:${novel.color || '#f8c8dc'};"></span>
                                ${escapeHtml(novel.title)}
                                ${novel.isAdult ? '<span class="badge-icon" title="성인 작품">🔞</span>' : ''}
                            </a>
                        </td>
                        <td class="tag-cell">
                            ${tags.length ? tags.map(t => `<span class="tag-inline" data-action="filter-tag" data-tag="${escapeHtml(t)}">*${escapeHtml(t)}</span>`).join(' ') : '-'}
                        </td>
                        <td class="cell-center chapter-count">${novel.chapterCount || 0}화</td>
                        <td class="cell-right char-count">${(novel.totalChars || 0).toLocaleString()}자</td>
                        <td class="cell-center status-cell"><span>${statusInfo.emoji}</span></td>
                    </tr>
                `;
            }

            renderDetailView() {
                const novel = this.currentNovel;
                if (!novel) return `<div style="text-align:center; padding:5rem;"><button onclick="viewer.goToList()" class="btn btn-soft">목록으로</button></div>`;
                if (!novel.chapters || novel.chapters.length === 0) novel.chapters = [{ title: '1화', content: '' }];
                if (!novel.settings || novel.settings.length === 0) novel.settings = [{ title: '기본 설정', content: '' }];

                const tags = novel.keyword ? novel.keyword.split(',').map(t => t.trim()).filter(Boolean) : [];
                const hasSettings = typeof computeHasRichSettings === 'function' ? computeHasRichSettings(novel.settings) : false;

                return `
                    <div class="detail-view">
                        <div class="panel detail-header">
                            <div class="detail-title-wrap">
                                <span class="color-dot" style="background-color:${novel.color || '#f8c8dc'};"></span>
                                <h2 class="detail-title">
                                    ${escapeHtml(novel.title)}
                                    ${novel.isAdult ? '<span class="badge-icon">🔞</span>' : ''}
                                </h2>
                            </div>
                            <div class="detail-title-row">
                                <div class="detail-tabs">
                                    <button onclick="viewer.switchTab('chapters')" class="tab-btn ${this.activeDetailTab === 'chapters' ? 'active' : ''}">연재 소설 본문</button>
                                    <button onclick="viewer.switchTab('settings')" class="tab-btn ${this.activeDetailTab === 'settings' ? 'active' : ''}">설정 및 메모 ${hasSettings ? '🏷️' : ''}</button>
                                </div>
                                <div class="detail-actions">
                                    <button onclick="viewer.goToList()" class="btn btn-soft btn-sm">목록으로</button>
                                    <!-- 3) 본문 페이지 ▲ 이전글, 다음글▼ 버튼 추가 -->
                                    <button onclick="viewer.goToPrevNovel()" class="btn btn-soft btn-sm">▲ 이전글</button>
                                    <button onclick="viewer.goToNextNovel()" class="btn btn-soft btn-sm">▼ 다음글</button>
                                </div>
                            </div>
                            <div class="keyword-row">
                                <div class="keyword-list">
                                    <span class="label">키워드:</span>
                                    ${tags.map(t => `<span class="keyword-badge">#${escapeHtml(t)}</span>`).join('')}
                                </div>
                            </div>
                        </div>

                        <div class="detail-grid">
                            <div class="panel sidebar">
                                <div class="sidebar-header">
                                    <h3 class="sidebar-title">${this.activeDetailTab === 'chapters' ? `회차 (${novel.chapters.length})` : `설정 (${novel.settings.length})`}</h3>
                                </div>
                                <div class="sidebar-list">
                                    ${this.activeDetailTab === 'chapters' 
                                        ? novel.chapters.map((ch, idx) => `
                                            <button onclick="viewer.selectChapter(${idx})" class="list-item ${idx === this.selectedChapterIndex ? 'active' : ''}">
                                                <span class="list-item-title">${escapeHtml(ch.title)}</span>
                                                <span class="list-item-meta">${(ch.content || '').length}자</span>
                                            </button>`).join('')
                                        : novel.settings.map((st, idx) => `
                                            <button onclick="viewer.selectSetting(${idx})" class="list-item ${idx === this.selectedSettingIndex ? 'active' : ''}">
                                                <span class="list-item-title">${escapeHtml(st.title)}</span>
                                            </button>`).join('')}
                                </div>
                            </div>

                            <div class="panel content-panel" id="${this.activeDetailTab === 'chapters' ? 'chapterContentPanel' : 'settingContentPanel'}">
                                ${this.activeDetailTab === 'chapters' 
                                    ? this.renderChapterContentInner(novel.chapters[this.selectedChapterIndex])
                                    : this.renderSettingContentInner(novel.settings[this.selectedSettingIndex])}
                            </div>
                        </div>
                    </div>
                `;
            }

            /* 4) 소설 본문 화면 툴바 구성 (폰트, 줄간격, 글자크기, 여백크기, 본문검색) */
            renderChapterContentInner(chapter) {
                const novel = this.currentNovel;
                const currentChars = chapter.content ? chapter.content.length : 0;
                return `
                    <h3 class="content-title">${escapeHtml(chapter.title)}</h3>
                    <div class="content-header">
                        <div class="content-stats">
                            <span>글자수: <font class="highlight">${currentChars.toLocaleString()}자</font></span>
                        </div>
                        <div class="chapter-nav">
                            <button onclick="viewer.goToPrevChapter()" class="chapter-nav-btn" ${this.selectedChapterIndex === 0 ? 'disabled' : ''}>‹ 이전 회차</button>
                            <span class="chapter-nav-sep">|</span>
                            <button onclick="viewer.goToNextChapter()" class="chapter-nav-btn" ${this.selectedChapterIndex === novel.chapters.length - 1 ? 'disabled' : ''}>다음 회차 ›</button>
                        </div>
                    </div>

                    <div class="content-toolbar">
                        <div class="toolbar-row">
                            <div class="toolbar-group">
                                <select onchange="viewer.changeFontFamily(this.value)" class="toolbar-select">
                                    <option value="font-nanumgothic" ${this.fontFamily === 'font-nanumgothic' ? 'selected' : ''}>나눔고딕</option>
                                    <option value="font-nanummyeongjo" ${this.fontFamily === 'font-nanummyeongjo' ? 'selected' : ''}>나눔명조</option>
                                    <option value="font-ridibatang" ${this.fontFamily === 'font-ridibatang' ? 'selected' : ''}>리디바탕</option>
                                </select>
                                <select onchange="viewer.changeLineHeight(this.value)" class="toolbar-select">
                                    <option value="150%" ${this.lineHeight === '150%' ? 'selected' : ''}>줄간격 150%</option>
                                    <option value="180%" ${this.lineHeight === '180%' ? 'selected' : ''}>줄간격 180%</option>
                                    <option value="200%" ${this.lineHeight === '200%' ? 'selected' : ''}>줄간격 200%</option>
                                    <option value="240%" ${this.lineHeight === '240%' ? 'selected' : ''}>줄간격 240%</option>
                                </select>
                                <div class="font-size-control">
                                    <span class="label">글자</span>
                                    <button onclick="viewer.changeFontSize(-1)">-</button>
                                    <span class="value" id="fontSizeLabel">${this.fontSize}pt</span>
                                    <button onclick="viewer.changeFontSize(1)">+</button>
                                </div>
                                <div class="font-size-control">
                                    <span class="label">여백</span>
                                    <button onclick="viewer.changeContentPadding(-4)">-</button>
                                    <span class="value" id="paddingSizeLabel">${this.contentPadding}px</span>
                                    <button onclick="viewer.changeContentPadding(4)">+</button>
                                </div>
                                <div class="search-inline">
                                    <input type="text" id="internalSearchInput" placeholder="본문 검색..." onkeydown="if(event.key==='Enter') viewer.handleInternalSearch(this.value)">
                                    <button onclick="viewer.handleInternalSearch(document.getElementById('internalSearchInput').value)">🔍</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="chapterContentDisplay" class="content-display ${this.fontFamily}" style="font-size:${this.fontSize}pt; line-height:${this.lineHeight}; padding:${this.contentPadding}px;">
                        ${escapeHtml(chapter.content || '').trim()}
                    </div>

                    <!-- 5) 소설 본문 맨 하단 요청 버튼 추가 -->
                    <div class="content-bottom">
                        <div class="chapter-nav">
                            <button onclick="viewer.goToPrevChapter()" class="chapter-nav-btn" ${this.selectedChapterIndex === 0 ? 'disabled' : ''}>‹ 이전 회차</button>
                            <span class="chapter-nav-sep">|</span>
                            <button onclick="viewer.goToNextChapter()" class="chapter-nav-btn" ${this.selectedChapterIndex === novel.chapters.length - 1 ? 'disabled' : ''}>다음 회차 ›</button>
                            <span class="chapter-nav-sep">|</span>
                            <button onclick="window.scrollTo({top:0})" class="chapter-nav-btn">맨 위로</button>
                            <span class="chapter-nav-sep">|</span>
                            <button onclick="viewer.switchTab('settings')" class="chapter-nav-btn">설정 및 메모</button>
                            <span class="chapter-nav-sep">|</span>
                            <button onclick="viewer.goToList()" class="chapter-nav-btn">목록</button>
                        </div>
                    </div>
                `;
            }

            /* 6, 7) 설정 본문 마크다운 적용 및 맨 하단 버튼 추가 */
            renderSettingContentInner(setting) {
                const novel = this.currentNovel;
                const isFirst = this.selectedSettingIndex === 0;
                const isLast = this.selectedSettingIndex === novel.settings.length - 1;
                return `
                    <h3 class="content-title">${escapeHtml(setting.title)}</h3>
                    <div class="content-header">
                        <div class="content-subtitle">글자수: ${(setting.content || '').length.toLocaleString()}자</div>
                        <div class="chapter-nav">
                            <button onclick="viewer.goToPrevSetting()" class="chapter-nav-btn" ${isFirst ? 'disabled' : ''}>‹ 이전 설정</button>
                            <span class="chapter-nav-sep">|</span>
                            <button onclick="viewer.goToNextSetting()" class="chapter-nav-btn" ${isLast ? 'disabled' : ''}>다음 설정 ›</button>
                        </div>
                    </div>

                    <!-- 6) 설정 본문 마크다운 파서 적용 -->
                    <div id="settingContentDisplay" class="content-display markdown-render setting-display ${this.fontFamily}" style="font-size:${this.fontSize}pt; line-height:${this.lineHeight}; padding:${this.contentPadding}px;">
                        ${parseMarkdown(setting.content || '설정 내용이 없습니다.')}
                    </div>

                    <!-- 7) 설정 본문 맨 하단 네비게이션 버튼 추가 -->
                    <div class="content-bottom">
                        <div class="chapter-nav">
                            <button onclick="viewer.goToPrevSetting()" class="chapter-nav-btn" ${isFirst ? 'disabled' : ''}>‹ 이전 설정</button>
                            <span class="chapter-nav-sep">|</span>
                            <button onclick="viewer.goToNextSetting()" class="chapter-nav-btn" ${isLast ? 'disabled' : ''}>다음 설정 ›</button>
                            <span class="chapter-nav-sep">|</span>
                            <button onclick="window.scrollTo({top:0})" class="chapter-nav-btn">맨 위로</button>
                            <span class="chapter-nav-sep">|</span>
                            <button onclick="viewer.switchTab('chapters')" class="chapter-nav-btn">소설 본문</button>
                            <span class="chapter-nav-sep">|</span>
                            <button onclick="viewer.goToList()" class="chapter-nav-btn">목록</button>
                        </div>
                    </div>
                `;
            }

            switchTab(tab) {
                this.activeDetailTab = tab;
                this.render();
                window.scrollTo({ top: 0, behavior: 'auto' });
            }

            selectChapter(idx) {
                this.selectedChapterIndex = idx;
                const panel = document.getElementById('chapterContentPanel');
                if (panel && this.currentNovel) {
                    panel.innerHTML = this.renderChapterContentInner(this.currentNovel.chapters[idx]);
                }
                document.querySelectorAll('.sidebar-list .list-item').forEach((btn, i) => {
                    btn.classList.toggle('active', i === idx);
                });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            selectSetting(idx) {
                this.selectedSettingIndex = idx;
                const panel = document.getElementById('settingContentPanel');
                if (panel && this.currentNovel) {
                    panel.innerHTML = this.renderSettingContentInner(this.currentNovel.settings[idx]);
                }
                document.querySelectorAll('.sidebar-list .list-item').forEach((btn, i) => {
                    btn.classList.toggle('active', i === idx);
                });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            goToPrevChapter() {
                if (this.selectedChapterIndex > 0) this.selectChapter(this.selectedChapterIndex - 1);
            }
            goToNextChapter() {
                if (this.currentNovel && this.selectedChapterIndex < this.currentNovel.chapters.length - 1) {
                    this.selectChapter(this.selectedChapterIndex + 1);
                }
            }
            goToPrevSetting() {
                if (this.selectedSettingIndex > 0) this.selectSetting(this.selectedSettingIndex - 1);
            }
            goToNextSetting() {
                if (this.currentNovel && this.selectedSettingIndex < this.currentNovel.settings.length - 1) {
                    this.selectSetting(this.selectedSettingIndex + 1);
                }
            }

            filterByTag(tag) { this.selectedTag = tag; this.render(); }
            changeSort(order) { this.sortOrder = order; this.render(); }
            executeSearch() {
                const input = document.getElementById('searchInput');
                if (input) this.searchQuery = input.value.toLowerCase();
                this.render();
            }
            resetSearch() {
                this.searchQuery = '';
                this.selectedTag = '전체';
                this.selectedStatus = 'all';
                this.selectedAdult = 'all';
                const input = document.getElementById('searchInput');
                if (input) input.value = '';
                this.render();
            }
        }

        const viewer = new NovelViewerApp();
    </script>
</body>
</html>
